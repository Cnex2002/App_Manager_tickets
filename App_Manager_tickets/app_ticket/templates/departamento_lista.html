<!DOCTYPE html>
<html>
<head>
    <title>Lista de Departamentos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<h1 class="mt-4">Lista de Departamentos</h1>
<a href="{% url 'departamento_nuevo' %}" class="btn btn-success">Nuevo Departamento</a>
<table class="table table-bordered">
    <thead>
        <tr>
            <th>Nombre</th>
            <th>Sucursal</th>
            <th>Observaciones</th>
            <th>Estado</th>
            <th>Accion</th>
        </tr>
    </thead>
    <tbody>
        {% for d in departamentos %}
        <tr>
            <td>{{ d.nombre }}</td>
            <td>{{ d.sucursal.nombre }}</td>
            <td>{{ d.observaciones }}</td>
            <td>{{ d.estado }}</td>
            <td>
                <button href="#">Ver Detalles</button>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
</body>
</html>
