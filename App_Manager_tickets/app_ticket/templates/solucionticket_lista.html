<!DOCTYPE html>
<html>
<head>
    <title>Lista de Tickets a Solucionar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<h1 class="mt-4">Lista de Tickets a Solucionar</h1>
<a href="{% url 'evaluacion_nueva' %}" class="btn btn-success">Nueva Evaluacion</a>
<table class="table table-bordered">

    <thead>
        <tr>
            <th>Ticket</th>
            <th>Imagen</th>
            <th>Comentarios</th>
            <th>Fecha de Cierre</th>
        </tr>
    </thead>
    <tbody>
        {% for soluciontickets in solucionticket %}
        <tr>
            <td>{{ soluciontickets.ticket }}</td>
            <td>{{ soluciontickets.ruta_imagen }}</td>
            <td>{{ soluciontickets.comentario}}</td>
            <td>{{ soluciontickets.fecha_subida}}</td>
            <td>
               
            </td>

        </tr>
        {% endfor %}
    </tbody>
</table>
</body>
</html>
