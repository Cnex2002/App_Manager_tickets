<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            max-width: 600px;
            margin-top: 60px;
        }
        .form-title {
            text-align: center;
            margin-bottom: 30px;
            color: #343a40;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="card shadow">
        <div class="card-body">
            <h2 class="form-title">Registrar Nueva cliente</h2>

            <form method="POST" class="needs-validation" novalidate>
                {% csrf_token %}

                <div class="mb-3">
                    <label for="{{ formulario.nombres.id_for_label }}" class="form-label">Nombre</label>
                    {{ formulario.nombres }}
                </div>

                <div class="mb-3">
                    <label for="{{ formulario.telefono.id_for_label }}" class="form-label">RUC</label>
                    {{ formulario.telefono }}
                </div>

                <div class="mb-3">
                    <label for="{{ formulario.direccion.id_for_label }}" class="form-label">Dirección</label>
                    {{ formulario.direccion }}
                </div>

                <div class="mb-3">
                    <label for="{{ formulario.correo.id_for_label }}" class="form-label">Correo</label>
                    {{ formulario.correo }}
                </div>
             

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-block">Guardar Cliente</button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
