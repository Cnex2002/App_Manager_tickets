<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<style>
  body {
    font-family: DejaVu Sans, sans-serif;
    font-size: 12px;
    margin: 20px;
  }
  h2 {
    text-align: center;
    margin-bottom: 30px;
  }
  .registro {
    border: 1.5px solid #444;
    border-radius: 8px;
    padding: 15px 20px;
    margin-bottom: 25px;
    background-color: #f9f9f9;
    page-break-inside: avoid;
  }

</style>
</head>
<body>
  <h2>Listado de Problemas y Soluciones</h2>
  {% for solucion in soluciones %}
    <div class="registro">
      <div class="titulo">Problema:</div>
      <div class="texto">{{ solucion.ticket.descripcion }}</div>
      <div class="titulo">Solución:</div>
      <div class="texto">{{ solucion.comentario|default:"Sin solución registrada." }}</div>
    </div>
  {% endfor %}
</body>
</html>
