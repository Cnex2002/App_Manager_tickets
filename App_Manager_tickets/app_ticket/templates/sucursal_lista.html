<!DOCTYPE html>
<html>
<head>
    <title>Lista de Sucursales</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<h1 class="mt-4">Lista de Sucursales</h1>
<a href="{% url 'sucursal_nuevo' %}" class="btn btn-success">Nueva Sucursal</a>
<table class="table table-bordered">
    <thead>
        <tr>
            <th>Nombre</th>
            <th>Dirección</th>
            <th>Empresa</th>
            <th>Estado</th>
            <th>Accion</th>

        </tr>
    </thead>
    <tbody>
        {% for s in sucursales %}
        <tr>
            <td>{{ s.nombre }}</td>
            <td>{{ s.direccion }}</td>
            <td>{{ s.empresa.nombre }}</td>
            <td>{{ s.estado }}</td>
            <td>
                <a href="{% url 'sucursal_editar' s.id %}" class="btn btn-primary">Editar</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
</body>
</html>
