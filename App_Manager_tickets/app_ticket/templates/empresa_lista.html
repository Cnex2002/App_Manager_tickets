<!DOCTYPE html>
<html> 
<head> 
    <title>Lista de empresas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>


<h1>Lista de empresas</h1>
<a href="{% url 'empresa_nuevo' %}" class="btn btn-success">Nueva Empresa</a>
    <table class="table">
        <thead>
            <tr>
                <th>Nombre </th>
                <th>Ruc </th>
                <th>Direccion </th>
                <th>Estado</th>
                <th>Accion</th>
            </tr>
            
        </thead>
        <tbody>
            {% for e in empresas %}
                <tr>
                    <td>{{ e.nombre }}</td>
                    <td>{{ e.ruc }}</td>
                    <td>{{ e.direccion }}</td>
                    <td>{{ e.estado }}</td>
                    
                    </td>
                    <td>
                        <button href="#">Ver Detalles</button>
                    </td>
                </tr>
            {% endfor %}
        </tbody>
    </table> 

</body>

</html>
