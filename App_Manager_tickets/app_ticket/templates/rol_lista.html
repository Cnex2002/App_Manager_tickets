

<!DOCTYPE html>
<html>
<head>
    <title>Lista de Categorías</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<h1 class="mt-4">Lista de Categorías</h1>
<a href="{% url 'rol_nuevo' %}" class="btn btn-success">Nuevo Rol</a>  

<table class="table table-bordered">

    <thead>
        <tr>
            <th>Nombre</th>
           
        </tr>
    </thead>
    <tbody>
        {% for rol in roles %}
        <tr>
            <td>{{ rol.nombre }}</td>
            <td>
                <a href="{% url 'rol_editar' rol.id %}" class="btn btn-primary">Editar</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
</body>
</html>
