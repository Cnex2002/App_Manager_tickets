<!DOCTYPE html>
<html>
<head>
    <title>Lista de Evaluaciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<h1 class="mt-4">Lista de Evaluaciones</h1>
<a href="{% url 'evaluacion_nueva' %}" class="btn btn-success">Nueva Evaluacion</a>
<table class="table table-bordered">

    <thead>
        <tr>
            <th>Ticket</th>
            <th>Calificación</th>
            <th>Comentarios</th>
            <th>Fecha de evaluacion</th>
        </tr>
    </thead>
    <tbody>
        {% for evaluacion in evaluaciones %}
        <tr>
            <td>{{ evaluacion.ticket }}</td>
            <td>{{ evaluacion.calificacion }}</td>
            <td>{{ evaluacion.comentarios}}</td>
            <td>{{ evaluacion.fecha_evaluacion}}</td>
            <td>
                <a href="{% url 'evaluacion_editar' evaluacion.id %}" class="btn btn-primary btn-sm">Editar</a>
            </td>

        </tr>
        {% endfor %}
    </tbody>
</table>
</body>
</html>
