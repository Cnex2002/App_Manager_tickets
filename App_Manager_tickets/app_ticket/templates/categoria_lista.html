<!DOCTYPE html>
<html>
<head>
    <title>Lista de Categorías</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<h1 class="mt-4">Lista de Categorías</h1>
<a href="{% url 'categoria_nuevo' %}" class="btn btn-success">Nueva Categoría</a>
<table class="table table-bordered">

    <thead>
        <tr>
            <th>Nombre</th>
            <th>Accion</th>
        </tr>
    </thead>
    <tbody>
        {% for cat in categorias %}
        <tr>
            <td>{{ cat.nombre }}</td>
            <td>
                <button href="#">Ver Detalles</button>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
</body>
</html>
